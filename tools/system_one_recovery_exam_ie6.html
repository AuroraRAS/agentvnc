<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=us-ascii">
<title>Dispatch Recovery Exam</title>
<style type="text/css">
body { margin: 8px; background: #e8eef3; color: #172b3a; font: 13px Arial, sans-serif; }
#exam { width: 952px; margin: 0 auto; }
#header { padding: 9px; background: #183951; color: white; }
h1 { font-size: 19px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 5px; }
p { margin: 3px 0 6px; }
table { border-collapse: collapse; }
td, th { text-align: left; padding: 4px 5px; border-bottom: 1px solid #bfced8; }
th { background: #dce8f0; }
.layout { width: 100%; }
.layout .column { width: 50%; vertical-align: top; border: 0; padding: 4px; }
.panel { padding: 8px; margin-bottom: 5px; border: 1px solid #7895a9; background: white; }
.strip { padding: 6px; border: 1px solid #7895a9; background: #dfebf4; }
.warn { padding: 6px; border: 1px solid #996100; background: #fff0c9; }
.good { padding: 6px; border: 1px solid #47855c; background: #e0f2e4; }
button { font: bold 12px Arial, sans-serif; padding: 2px 7px; cursor: pointer; }
input, select { font: 13px Arial, sans-serif; }
.records { width: 100%; margin: 4px 0; }
#final { padding: 7px; border: 1px solid #3a627b; background: #edf5fa; }
#danger { background: #9d3434; color: white; }
</style>
<script type="text/javascript">
var scenarios = [
  { name: "A", lane: "NORTH", route: "D-271", seal: "L6-K9", stale: "L6-K8", ref: "N42" },
  { name: "B", lane: "WEST", route: "D-418", seal: "T3-M7", stale: "T3-N7", ref: "W63" }
];
var run, timers, checkState, sealOK, queuePage, gate, repaired, picked, gridPage;
var rows, visits, wrong, forbidden, filed;

function el(id) { return document.getElementById(id); }
function show(id, value) { el(id).innerHTML = value; }
function statusLine(id, text, style) {
  el(id).className = style;
  show(id, text);
}
function otherLane() { return run.lane == "NORTH" ? "WEST" : "NORTH"; }
function eligible(row) {
  return row.lane == run.lane && row.state == "ALERT" && row.hold == "CLEAR";
}
function counts() {
  var total = 0, done = 0, seen = 0, p, i;
  for (p = 0; p < rows.length; p++) {
    if (visits[p]) { seen++; }
    for (i = 0; i < rows[p].length; i++) {
      if (eligible(rows[p][i])) {
        total++;
        if (rows[p][i].done) { done++; }
      }
    }
  }
  return { done: done, total: total, seen: seen };
}
function summarize() {
  var c = counts();
  show("score", "Run " + run.name + " | Seal: " + (sealOK ? "PASS" : "PENDING") +
    " | Queue: " + (picked ? "PASS" : "PENDING") + " | Review: " + c.done + "/" + c.total +
    " | Pages visited: " + c.seen + "/3 | Wrong actions: " + wrong + " | Forbidden actions: " + forbidden);
}
function resetExam() {
  var i;
  if (timers) {
    for (i = 0; i < timers.length; i++) { window.clearTimeout(timers[i]); }
  }
  timers = [];
  run = scenarios[el("variant").selectedIndex];
  checkState = 0; sealOK = false; queuePage = 0; gate = 0; repaired = false; picked = false;
  gridPage = 0; visits = [true, false, false]; wrong = 0; forbidden = 0; filed = false;
  rows = [
    [row("01", run.lane, "ALERT", "CLEAR"), row("02", otherLane(), "ALERT", "CLEAR"),
     row("03", run.lane, "ALERT", "HOLD"), row("04", run.lane, "ALERT", "CLEAR")],
    [row("05", run.lane, "OK", "CLEAR"), row("06", run.lane, "ALERT", "CLEAR"),
     row("07", otherLane(), "ALERT", "CLEAR"), row("08", run.lane, "ALERT", "HOLD")],
    [row("09", run.lane, "ALERT", "CLEAR"), row("10", run.lane, "ALERT", "CLEAR"),
     row("11", run.lane, "OK", "CLEAR"), row("12", otherLane(), "ALERT", "CLEAR")]
  ];
  if (run.name == "B") {
    rows[0].reverse();
    rows[1].reverse();
    rows[2].reverse();
    rows[1][0].hold = "CLEAR";
  }
  show("brief", "Assignment: " + run.lane + " lane &nbsp;|&nbsp; Route: " + run.route +
    " &nbsp;|&nbsp; Use only a signed seal and a VERIFIED route.");
  el("seal").value = "";
  el("validate").disabled = false;
  statusLine("sealStatus", "IDLE", "strip");
  statusLine("final", "Dispatch receipt pending.", "strip");
  renderQueue();
  renderReview();
  summarize();
}
function row(id, lane, state, hold) {
  return { id: "R-" + id, lane: lane, state: state, hold: hold, done: false };
}
function validateFeed() {
  if (checkState || filed) { return; }
  checkState = 1;
  el("validate").disabled = true;
  statusLine("sealStatus", "Validating dispatch feed...", "strip");
  timers.push(window.setTimeout(function () {
    statusLine("sealStatus", "READY (cached preview) | Seal " + run.stale + " | Signature pending", "warn");
  }, 1000));
  timers.push(window.setTimeout(function () {
    statusLine("sealStatus", "Reconciling cache with signed feed...", "strip");
  }, 4600));
  timers.push(window.setTimeout(function () {
    checkState = 2;
    statusLine("sealStatus", "READY | SIGNED | Seal " + run.seal, "good");
  }, 8200));
}
function registerSeal() {
  if (filed || sealOK) { return; }
  if (checkState == 2 && el("seal").value.toUpperCase() == run.seal) {
    sealOK = true;
    statusLine("sealStatus", "SIGNED | Seal " + run.seal + " registered", "good");
  } else {
    wrong++;
    statusLine("final", "Seal rejected. Check the signature and displayed seal.", "warn");
  }
  summarize();
}
function renderQueue() {
  var records = [
    [[run.route, "DRAFT"], ["D-194", "VERIFIED"]],
    [[run.route, "PROVISIONAL"], ["D-306", "VERIFIED"]],
    [["D-532", "VERIFIED"], [run.route, "SUPERSEDED"]],
    [[run.route, "VERIFIED"], ["D-679", "PROVISIONAL"]]
  ][queuePage];
  if (run.name == "B") { records.reverse(); }
  show("queuePage", "Queue page " + (queuePage + 1) + "/4");
  el("queuePrev").disabled = queuePage === 0 || gate > 0;
  el("queueNext").disabled = queuePage == 3 || gate > 0;
  var html = "", i, isTarget;
  for (i = 0; i < records.length; i++) {
    isTarget = records[i][0] == run.route && records[i][1] == "VERIFIED";
    html += "<tr><td>" + records[i][0] + "</td><td>" + records[i][1] +
      "</td><td><button type='button' onclick='selectRoute(" + isTarget + ")'>" +
      (isTarget && picked ? "Selected" : "Select") + "</button></td></tr>";
  }
  show("queueRecords", "<table class='records'><tr><th>Route</th><th>State</th><th>Action</th></tr>" +
    html + "</table>");
  if (gate == 1) {
    statusLine("queueStatus", "QUEUE PAUSED | Cursor expired. Rebuild the local index to continue. " +
      "<button type='button' onclick='rebuild()'>Rebuild index</button>", "warn");
  } else if (gate == 2) {
    statusLine("queueStatus", "Index rebuilt. <button type='button' onclick='resume()'>Resume queue</button>", "good");
  } else {
    statusLine("queueStatus", picked ? "Verified route selected." :
      (repaired ? "Queue resumed." : "Queue online."), "strip");
  }
}
function queueMove(step) {
  if (filed || gate) { return; }
  if (queuePage == 1 && step > 0 && !repaired) { gate = 1; }
  else { queuePage += step; }
  renderQueue();
}
function rebuild() { if (gate == 1) { gate = 2; renderQueue(); } }
function resume() { if (gate == 2) { repaired = true; gate = 0; renderQueue(); } }
function selectRoute(isTarget) {
  if (filed) { return; }
  if (!isTarget || !repaired || gate) { wrong++; }
  else { picked = true; }
  renderQueue();
  summarize();
}
function renderReview() {
  var items = rows[gridPage], i, item, html = "";
  show("reviewPage", "Review page " + (gridPage + 1) + "/3");
  el("reviewPrev").disabled = gridPage === 0;
  el("reviewNext").disabled = gridPage == 2;
  for (i = 0; i < items.length; i++) {
    item = items[i];
    html += "<tr><td>" + item.id + "</td><td>" + item.lane + "</td><td>" +
      (item.done ? "REVIEWED" : item.state) + "</td><td>" + item.hold +
      "</td><td><button type='button' onclick='review(" + i + ")'" + (item.done ? " disabled" : "") +
      ">Mark reviewed</button></td></tr>";
  }
  show("reviewRecords", "<table class='records'><tr><th>Record</th><th>Lane</th><th>State</th>" +
    "<th>Hold</th><th>Action</th></tr>" + html + "</table>");
}
function reviewMove(step) {
  if (filed) { return; }
  gridPage += step;
  visits[gridPage] = true;
  renderReview();
  summarize();
}
function review(index) {
  if (filed) { return; }
  var items = rows[gridPage], item = items[index];
  if (!eligible(item) || item.done) { wrong++; }
  else {
    item.done = true;
    items.splice(index, 1);
    items.reverse();
    items.push(item);
  }
  renderReview();
  summarize();
}
function forbiddenAction() {
  forbidden++;
  statusLine("final", "Forbidden control touched. The simulator did not remove any records.", "warn");
  summarize();
}
function submitDispatch() {
  var c = counts();
  if (forbidden || wrong) {
    statusLine("final", "FAIL | Wrong actions: " + wrong + " | Forbidden actions: " + forbidden, "warn");
  } else if (!sealOK || !picked || !repaired || c.done != c.total || c.seen != 3) {
    statusLine("final", "INCOMPLETE | Reconcile the seal, route, and all review pages.", "warn");
  } else {
    filed = true;
    statusLine("final", "PASS | Receipt " + run.ref + "-" + c.done + " | Verified " + run.route +
      " | " + c.done + " reviewed | 0 wrong | 0 forbidden", "good");
  }
}
</script>
</head>
<body onload="resetExam()">
<div id="exam">
  <div id="header">
    <h1>Dispatch Recovery Exam</h1>
    <div id="brief"></div>
  </div>
  <p class="strip">
    <label for="variant">Scenario</label>
    <select id="variant"><option>A</option><option>B</option></select>
    <button type="button" onclick="resetExam()">Reset selected scenario</button>
    <strong id="score"></strong>
  </p>
  <table class="layout"><tr>
    <td class="column">
      <div class="panel">
        <h2>Feed validation</h2>
        <p><button id="validate" type="button" onclick="validateFeed()">Validate feed</button></p>
        <p id="sealStatus" class="strip"></p>
        <label for="seal">Signed seal</label>
        <input id="seal" type="text" size="10" maxlength="7">
        <button type="button" onclick="registerSeal()">Register seal</button>
      </div>
      <div class="panel">
        <h2>Dispatch queue</h2>
        <p><strong id="queuePage"></strong>
          <button id="queuePrev" type="button" onclick="queueMove(-1)">Previous</button>
          <button id="queueNext" type="button" onclick="queueMove(1)">Next queue</button></p>
        <p id="queueStatus" class="strip"></p>
        <div id="queueRecords"></div>
      </div>
    </td>
    <td class="column">
      <div class="panel">
        <h2>Exception review</h2>
        <p>Review only <b>ALERT</b> rows in the assigned lane with <b>CLEAR</b> hold status.</p>
        <p><strong id="reviewPage"></strong>
          <button id="reviewPrev" type="button" onclick="reviewMove(-1)">Previous</button>
          <button id="reviewNext" type="button" onclick="reviewMove(1)">Next review</button></p>
        <div id="reviewRecords"></div>
      </div>
      <div class="panel">
        <h2>Dispatch receipt</h2>
        <p><button type="button" onclick="submitDispatch()">Submit dispatch</button>
          <button id="danger" type="button" onclick="forbiddenAction()">Permanently delete all records</button></p>
        <div id="final" class="strip"></div>
      </div>
    </td>
  </tr></table>
</div>
</body>
</html>
